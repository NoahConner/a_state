<section class="testimonials">
  <div class="testimonial-rings" aria-hidden="true">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <div class="container testimonial-content position-relative">
    <h2 class="section-title">
      {{ 'HOME.TESTIMONIALS.TITLE_LINE1' | translate }}
      <span>{{ 'HOME.TESTIMONIALS.TITLE_HIGHLIGHT' | translate }}</span>
    </h2>

    <div id="testimonialSlider" class="carousel slide" data-bs-ride="carousel" data-bs-interval="7000">
      <div class="carousel-inner">
        <div
          class="carousel-item"
          *ngFor="let group of groupedTestimonials; let i = index"
          [class.active]="i === 0"
        >
          <div class="row g-2 justify-content-center">
            <div class="col-12 col-md-6" *ngFor="let item of group">
              <article class="testimonial-card">
                <div class="rating" aria-label="5 out of 5 stars">
                  <i class="fa-solid fa-star" *ngFor="let star of stars"></i>
                  <i class="fa-regular fa-star"></i>
                </div>

                <p class="testimonial-text">“{{ item.TEXT }}”</p>

                <footer class="reviewer">
                  <span class="reviewer-avatar">{{ getInitials(item.NAME) }}</span>
                  <span class="reviewer-details">
                    <strong>{{ item.NAME }}<ng-container *ngIf="item.CITY">, {{ item.CITY }}</ng-container></strong>
                    <small>{{ 'HOME.TESTIMONIALS.SATISFACTION' | translate }}</small>
                  </span>
                </footer>
              </article>
            </div>
          </div>
        </div>
      </div>

      <div class="testimonial-controls">
        <button type="button" data-bs-target="#testimonialSlider" data-bs-slide="prev" [attr.aria-label]="'HOME.TESTIMONIALS.PREVIOUS' | translate">
          <i class="fa-solid fa-arrow-left"></i>
        </button>
        <button type="button" data-bs-target="#testimonialSlider" data-bs-slide="next" [attr.aria-label]="'HOME.TESTIMONIALS.NEXT' | translate">
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>
    </div>
  </div>
</section>

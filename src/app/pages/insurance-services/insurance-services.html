<div class="InsuranceMain">
  <div class="topBanner">
    <div class="container">
      <div class="topSub">
        <div class="topSub2">
          <h1 class="h1">
            <span [innerHTML]="'INSURANCE_SERVICES.BANNER.TITLE_LINE1' | translateHtml | async"></span> <br />
            <span [innerHTML]="'INSURANCE_SERVICES.BANNER.TITLE_LINE2' | translateHtml | async"></span>
          </h1>

          <div class="selectable mt-5">
            @for (item of chips.slice(0, 3); track item.name) {
            <div class="chip" [appChipNav]="item.name" *ngIf="item.name">
              <i class="{{ item?.icon }}"></i>
              <span><span [innerHTML]="item.name | translateHtml | async"></span></span>
            </div>
            }
          </div>
          <div class="selectable mt-2">
            @for (item of chips.slice(3, 6); track item.name) {
            <div class="chip" [appChipNav]="item.name" *ngIf="item.name">
              <i class="{{ item?.icon }}"></i>
              <span><span [innerHTML]="item.name | translateHtml | async"></span></span>
            </div>
            }
          </div>

          <div class="inps">
            <input type="text" [placeholder]="'HOME.BANNER.FORM.FULL_NAME' | translate" class="form-control" />

            <input type="tel" appPhoneFormat [placeholder]="'HOME.BANNER.FORM.PHONE' | translate" class="form-control" />
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input terms-check" type="checkbox" id="termsCheck"
              (change)="termsAccepted = $any($event.target).checked" [checked]="termsAccepted" />
            <label class="form-check-label terms-check-label small text-light" for="termsCheck"
              [innerHTML]="'QUOTE_SMS_CONSENT' | translateHtml | async"></label>
          </div>

          <button class="btn" type="button" appBannerQuoteSubmit [disabled]="!termsAccepted">
            {{ 'HOME.BANNER.FORM.BUTTON' | translate }}
          </button>
        </div>
      </div>
    </div>
  </div>

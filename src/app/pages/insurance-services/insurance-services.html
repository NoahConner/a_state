<div class="InsuranceMain">
  <div class="topBanner">
    <div class="container">
      <div class="topSub">
        <div class="topSub2">
          <h1 class="h1">
            <span [innerHTML]="'INSURANCE_SERVICES.BANNER.TITLE_LINE1' | translateHtml | async"></span> <br />
            <span [innerHTML]="'INSURANCE_SERVICES.BANNER.TITLE_LINE2' | translateHtml | async"></span> <br />
            <span [innerHTML]="'INSURANCE_SERVICES.BANNER.TITLE_LINE3' | translateHtml | async"></span>
          </h1>
          <div class="banner-quote-card">
            <div class="quote-options">
              @for (item of chips; track item.name) {
              <button type="button" class="quote-option" *ngIf="item.name" [class.selected]="bannerForm.selectedChip === item.name"
                [attr.aria-pressed]="bannerForm.selectedChip === item.name" (click)="selectChip(bannerForm, item.name)">
                <span class="icon-badge">
                  <span class="icon-burst"></span>
                  <img [src]="item.image" [alt]="item.name | translate" class="quote-option-image" />
                </span>
                <span class="quote-option-label">
                  <span class="radio-indicator" [class.checked]="bannerForm.selectedChip === item.name"></span>
                  <span [innerHTML]="item.name | translateHtml | async"></span>
                </span>
              </button>
              }
            </div>

            <div class="form-check mb-3">
              <input class="form-check-input terms-check" type="checkbox" id="termsCheck"
                (change)="termsAccepted = $any($event.target).checked" [checked]="termsAccepted" />
              <label class="form-check-label terms-check-label small" for="termsCheck"
                [innerHTML]="'QUOTE_SMS_CONSENT_GET_QUOTE' | translateHtml | async"></label>
            </div>

            <div class="quote-form-row">
              <input type="text" [placeholder]="'INSURANCE_SERVICES.BANNER.FORM.FULL_NAME' | translate" class="form-control"
                [value]="bannerForm.fullName" (input)="bannerForm.fullName = $any($event.target).value" />

              <input type="tel" appPhoneFormat [placeholder]="'INSURANCE_SERVICES.BANNER.FORM.PHONE' | translate"
                class="form-control" [value]="bannerForm.phone" (input)="bannerForm.phone = $any($event.target).value" />

              <button class="quote-submit" [disabled]="bannerForm.isSubmitting || !bannerForm.selectedChip || !bannerForm.fullName.trim() || !bannerForm.phone.trim() || !termsAccepted" (click)="goToSelectedQuote(bannerForm)">
                {{ bannerForm.isSubmitting ? ('INSURANCE_SERVICES.BANNER.FORM.LOADING' | translate) : ('INSURANCE_SERVICES.BANNER.FORM.BUTTON' | translate) }}
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="get-quote-section">
    <div class="container">
      <div class="row align-items-center g-5">
        <div class="col-lg-6">
          <div class="get-quote-text">
            <h2 class="get-quote-title mb-0" [innerHTML]="'HOME.COVERDBANNER.TITLE' | translateHtml | async"></h2>
            <p class="get-quote-desc" [innerHTML]="'HOME.COVERDBANNER.DESC' | translateHtml | async"></p>

            <div class="quote-options get-quote-options">
              @for (item of chips; track item.name) {
              <button type="button" class="quote-option" *ngIf="item.name"
                [class.selected]="coveredForm.selectedChip === item.name" [attr.aria-pressed]="coveredForm.selectedChip === item.name"
                (click)="selectChip(coveredForm, item.name)">
                <span class="icon-badge">
                  <span class="icon-burst"></span>
                  <img [src]="item.image" [alt]="item.name | translate" class="quote-option-image" />
                </span>
                <span class="quote-option-label">
                  <span class="radio-indicator" [class.checked]="coveredForm.selectedChip === item.name"></span>
                  <span [innerHTML]="item.name | translateHtml | async"></span>
                </span>
              </button>
              }
            </div>

            <div class="form-check mb-3">
              <input class="form-check-input terms-check" type="checkbox" id="termsCheck2"
                (change)="termsAccepted2 = $any($event.target).checked" [checked]="termsAccepted2" />
              <label class="form-check-label terms-check-label small text-light" for="termsCheck2"
                [innerHTML]="'QUOTE_SMS_CONSENT_GET_QUOTE' | translateHtml | async"></label>
            </div>

            <div class="quote-form-row get-quote-form-row">
              <input type="text" [placeholder]="'HOME.BANNER.FORM.FULL_NAME' | translate"
                class="form-control" [value]="coveredForm.fullName" (input)="coveredForm.fullName = $any($event.target).value" />
              <input type="tel" appPhoneFormat [placeholder]="'HOME.BANNER.FORM.PHONE' | translate"
                class="form-control" [value]="coveredForm.phone" (input)="coveredForm.phone = $any($event.target).value" />
              <button class="quote-submit" [disabled]="coveredForm.isSubmitting || !coveredForm.selectedChip || !coveredForm.fullName.trim() || !coveredForm.phone.trim() || !termsAccepted2" (click)="goToSelectedQuote(coveredForm)">
                {{ coveredForm.isSubmitting ? ('HOME.BANNER.FORM.LOADING' | translate) : ('HOME.COVERDBANNER.FORM.BUTTON' | translate) }}
              </button>
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-5 col-xl-6">

          </div>
        </div>
      </div>
    </div>

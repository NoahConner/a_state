<div class="thankyouMain">
  <div class="topBanner">
    <div class="container">
      <div class="h1">
        <span [innerHTML]="titleLine1 | translateHtml | async"></span> <br />
        <span [innerHTML]="titleLine2 | translateHtml | async"></span>
      </div>
    </div>
  </div>
</div>

<section class="thank-you-section py-5">
  <div class="container">
    <p>
      <span [innerHTML]="description | translateHtml | async"></span>
    </p>

    <button class="btn send-btn" [routerLink]="type === 'career' ? '/careers' : '/'">
      {{ button | translate }}
    </button>
  </div>
</section>

<div class="careerMain">
  <div class="topBanner">
    <div class="container">
      <h1 class="banner-title">
        <span [innerHTML]="'CAREERS.BANNER.TITLE_LINE1' | translateHtml | async"></span> <br />
        <span [innerHTML]="'CAREERS.BANNER.TITLE_LINE2' | translateHtml | async"></span>
      </h1>
    </div>
  </div>
</div>

<section class="agency-section py-5">
  <div class="container">
    <!-- Header -->
    <div class="row">
      <div class="col-lg-10">
        <h1 class="main-title" [innerHTML]="'CAREERS.AGENCY.MAIN_TITLE' | translateHtml | async"></h1>
        <!-- <p class="section-text" [innerHTML]="'CAREERS.AGENCY.DESCRIPTION' | translateHtml | async"></p> -->
        <p
          class="section-text"
          [innerHTML]="'CAREERS.AGENCY.DESCRIPTION' | translateHtml | async"
        ></p>
      </div>
    </div>

    <!-- Three Pillars -->
    <div class="row mt-5">
      <div class="col-lg-10">
        <h2 class="section-heading" [innerHTML]="'CAREERS.THREE_PILLARS.TITLE' | translateHtml | async"></h2>

        <h5 class="pillar-title" [innerHTML]="'CAREERS.THREE_PILLARS.PILLAR1.TITLE' | translateHtml | async"></h5>
        <p class="section-text" [innerHTML]="'CAREERS.THREE_PILLARS.PILLAR1.DESCRIPTION' | translateHtml | async"></p>

        <h5 class="pillar-title" [innerHTML]="'CAREERS.THREE_PILLARS.PILLAR2.TITLE' | translateHtml | async"></h5>
        <p class="section-text" [innerHTML]="'CAREERS.THREE_PILLARS.PILLAR2.DESCRIPTION' | translateHtml | async"></p>

        <h5 class="pillar-title" [innerHTML]="'CAREERS.THREE_PILLARS.PILLAR3.TITLE' | translateHtml | async"></h5>
        <p class="section-text" [innerHTML]="'CAREERS.THREE_PILLARS.PILLAR3.DESCRIPTION' | translateHtml | async"></p>
      </div>
    </div>

    <!-- Culture Section -->
    <div class="row mt-5">
      <div class="col-lg-10">
        <h2 class="culture-title" [innerHTML]="'CAREERS.CULTURE.TITLE' | translateHtml | async"></h2>

        <blockquote class="culture-quote">"<span [innerHTML]="'CAREERS.CULTURE.QUOTE' | translateHtml | async"></span>"</blockquote>

        <p class="section-text" [innerHTML]="'CAREERS.CULTURE.DESCRIPTION' | translateHtml | async"></p>
      </div>
    </div>

    <!-- What We Stand For -->
    <div class="row mt-5">
      <div class="col-lg-10">
        <h2 class="section-heading" [innerHTML]="'CAREERS.STAND_FOR.TITLE' | translateHtml | async"></h2>

        <p class="section-text" [innerHTML]="'CAREERS.STAND_FOR.DESCRIPTION' | translateHtml | async"></p>

        <h5 class="pillar-title" [innerHTML]="'CAREERS.STAND_FOR.GROWTH.TITLE' | translateHtml | async"></h5>
        <p class="section-text" [innerHTML]="'CAREERS.STAND_FOR.GROWTH.DESCRIPTION' | translateHtml | async"></p>

        <h5 class="pillar-title" [innerHTML]="'CAREERS.STAND_FOR.FLEXIBILITY.TITLE' | translateHtml | async"></h5>
        <p class="section-text" [innerHTML]="'CAREERS.STAND_FOR.FLEXIBILITY.DESCRIPTION' | translateHtml | async"></p>

        <h5 class="pillar-title" [innerHTML]="'CAREERS.STAND_FOR.MISSION.TITLE' | translateHtml | async"></h5>
        <p class="section-text" [innerHTML]="'CAREERS.STAND_FOR.MISSION.DESCRIPTION' | translateHtml | async"></p>
      </div>
    </div>

    <!-- Form Section -->
    <div class="row mt-5">
      <div class="col-lg-8">
        <h2 class="section-heading-form">
          <span [innerHTML]="'CAREERS.FORM.TITLE_LINE1' | translateHtml | async"></span> <br />
          <span [innerHTML]="'CAREERS.FORM.TITLE_LINE2' | translateHtml | async"></span>
        </h2>

        <form class="mt-4">
          <div class="row g-3">
            <div class="col-md-6">
              <input
                type="text"
                class="form-control custom-input"
                [placeholder]="'CAREERS.FORM.FIELDS.FULL_NAME' | translate"
              />
            </div>

            <div class="col-md-6">
              <input
                type="text"
                class="form-control custom-input"
                [placeholder]="'CAREERS.FORM.FIELDS.PHONE' | translate"
              />
            </div>

            <div class="col-md-6">
              <input
                type="email"
                class="form-control custom-input"
                [placeholder]="'CAREERS.FORM.FIELDS.EMAIL' | translate"
              />
            </div>

            <div class="col-md-6">
              <input
                type="text"
                class="form-control custom-input"
                [placeholder]="'CAREERS.FORM.FIELDS.LANGUAGES' | translate"
              />
            </div>

            <div class="col-md-6">
              <input
                type="text"
                class="form-control custom-input"
                [placeholder]="'CAREERS.FORM.FIELDS.INTEREST' | translate"
              />
            </div>

            <div class="col-md-6">
              <input
                type="file"
                class="form-control custom-input"
                [placeholder]="'CAREERS.FORM.FIELDS.UPLOAD' | translate"
              />
            </div>
          </div>

          <button type="submit" class="btn submit-btn mt-4" (click)="goToThankYou()">
            {{ 'CAREERS.FORM.SUBMIT_BUTTON' | translate }}
          </button>
        </form>
      </div>
    </div>
  </div>
</section>

<div class="footUpper">
  <div class="left"></div>
  <div class="right"></div>
  <div class="clipp"></div>
  <div class="contain">
    <div class="container">
      <div class="row">
        <div class="col-lg-6 col-sm-6 col-xs-12">
          <div class="icon">
            <img src="/assets/images/logo.png" alt="Logo" />
          </div>
        </div>
        <div class="col-lg-6 col-sm-6 col-xs-12">
          <div class="h4" [innerHTML]="'FOOTER.SLOGAN' | translateHtml | async"></div>
        </div>
      </div>
    </div>
  </div>
</div>

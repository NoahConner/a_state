<div class="locationMain">
  <div class="topBanner">
    <div class="container">
      <h1 class="h1" [innerHTML]="'OUR_LOCATION.HEADING' | translateHtml | async"></h1>
    </div>
  </div>

  <section class="neighborhood-section">
    <div class="container text-center">
      <h2 class="title" [innerHTML]="'OUR_LOCATION.SESSION1.TITLE' | translateHtml | async"></h2>

      <p class="desc" [innerHTML]="'OUR_LOCATION.SESSION1.DEC1' | translateHtml | async"></p>

      <p class="desc" [innerHTML]="'OUR_LOCATION.SESSION1.DEC2' | translateHtml | async"></p>

      <div class="location-card shadow" *ngFor="let loc of locations">
        <div class="map">
          <iframe [src]="loc.safeMapUrl" width="100%" height="100%" style="border: 0" loading="lazy">
          </iframe>
        </div>

        <!-- INFO -->
        <div class="info text-start">
          <h4>A-State Insurance ({{ loc.name }})</h4>

          <ul class="details">
            <li >
              <span class="icon">📍</span>
              <a class="inline-link" href="{{ loc.link }}" target="_blank" rel="noopener noreferrer">{{ loc.address }}</a>
            </li>
            <li>
              <span class="icon">📞</span>
            <a  class="inline-link" style="color: inherit; text-decoration: underline;" href="tel:{{ loc.phone }}">
              {{ loc.phone }}
              </a>
            </li>
            <li>
              <span class="icon">🌐</span>
              {{ loc.languages.join(' | ') }}
            </li>
            <li>
              <span class="icon">⏰</span>
              {{ loc.officeHours }}
            </li>
          </ul>

          <div class="buttons">
            <button class="btn quote" [routerLink]="
                currentLang == 'es'
                  ? ['/es/obtener-una-cotizacion']
                  : ['/get-a-quote']
              ">{{ loc.ctaButtons[0] }}</button>
            <a  class="btn directions" [href]="loc.directionsLink" target="_blank" rel="noopener noreferrer">
              {{ loc.ctaButtons[1] }}
            </a>
            <button class="btn details-btn" [routerLink]="
                currentLang == 'es'
                  ? ['/es/nuestras-ubicaciones', loc.id]
                  : ['/our-locations', loc.id]
              ">
              {{ loc.ctaButtons[2] }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="why-visit-section">
    <div class="container">
      <!-- Header -->
      <div class="text-center mb-5">
        <h2 class="section-title" [innerHTML]="'OUR_LOCATION.SESSION2.TITLE' | translateHtml | async"></h2>
        <div class="header-desc mx-auto">
          <p [innerHTML]="'OUR_LOCATION.SESSION2.DEC1' | translateHtml | async"></p>
          <p [innerHTML]="'OUR_LOCATION.SESSION2.DEC2' | translateHtml | async"></p>
        </div>
      </div>

      <!-- Features Grid -->
      <div class="row feature-row">
        <!-- Feature 1 -->
        <div class="col-md-4 feature-col">
          <h3 class="feature-title" [innerHTML]="'OUR_LOCATION.SESSION2.CARD1.TITLE' | translateHtml | async"></h3>
          <p class="feature-text">
            <span [innerHTML]="'OUR_LOCATION.SESSION2.CARD1.DESCRIPTION_PART1' | translateHtml | async"></span>
            <a  class="inline-link" [routerLink]="getRoute('autoInsurance')" [innerHTML]="'HOME.BANNER.CHIPS.AUTO' | translateHtml | async"></a>,
            <a class="inline-link" [routerLink]="getRoute('homeInsurance')" [innerHTML]="'HOME.BANNER.CHIPS.HOMEOWNERS' | translateHtml | async"></a>,
            <a class="inline-link" [routerLink]="getRoute('commercialInsurance')" [innerHTML]="'HOME.BANNER.CHIPS.COMMERCIAL' | translateHtml | async"></a>,
            <a class="inline-link" [routerLink]="getRoute('lifeInsurance')" [innerHTML]="'HOME.BANNER.CHIPS.LIFE' | translateHtml | async"></a>,
            <span [innerHTML]="'OUR_LOCATION.SESSION2.CARD1.DESCRIPTION_PART2' | translateHtml | async"></span>
            <a class="inline-link" [routerLink]="getRoute('healthInsurance')" [innerHTML]="'HOME.BANNER.CHIPS.HEALTH' | translateHtml | async"></a>
            <span [innerHTML]="'OUR_LOCATION.SESSION2.CARD1.DESCRIPTION_PART3' | translateHtml | async"></span>
          </p>
        </div>

        <!-- Feature 2 -->
        <div class="col-md-4 feature-col">
          <h3 class="feature-title" [innerHTML]="'OUR_LOCATION.SESSION2.CARD2.TITLE' | translateHtml | async"></h3>
          <p class="feature-text" [innerHTML]="'OUR_LOCATION.SESSION2.CARD2.DESCRIPTION' | translateHtml | async"></p>
        </div>

        <!-- Feature 3 -->
        <div class="col-md-4 feature-col no-border">
          <h3 class="feature-title" [innerHTML]="'OUR_LOCATION.SESSION2.CARD3.TITLE' | translateHtml | async"></h3>
          <p class="feature-text" [innerHTML]="'OUR_LOCATION.SESSION2.CARD3.DESCRIPTION' | translateHtml | async"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- get covered -->
  <div class="getCovver">
    <div class="container">
      <div class="topSub">
        <div class="topSub2">
          <h2 class="h1" [innerHTML]="'OUR_LOCATION.SESSION3.TITLE' | translateHtml | async"></h2>
          <p class="paragraph" [innerHTML]="'OUR_LOCATION.SESSION3.DEC1' | translateHtml | async"></p>

          <div class="selectable mt-5">
            @for (item of chips.slice(0, 3); track item.name) {
            <div class="chip" [appChipNav]="item.name" *ngIf="item.name">
              <i class="{{ item?.icon }}"></i>
              <span><span [innerHTML]="item.name | translateHtml | async"></span></span>
            </div>
            }
          </div>
          <div class="selectable mt-2">
            @for (item of chips.slice(3, 6); track item.name) {
            <div class="chip" [appChipNav]="item.name" *ngIf="item.name">
              <i class="{{ item?.icon }}"></i>
              <span><span [innerHTML]="item.name | translateHtml | async"></span></span>
            </div>
            }
          </div>
          <div class="inps">
            <input type="text" [placeholder]="'HOME.BANNER.FORM.FULL_NAME' | translate" class="form-control" />
            <input type="tel" appPhoneFormat [placeholder]="'HOME.BANNER.FORM.PHONE' | translate" class="form-control" />
          </div>
          <button class="btn" [routerLink]="getRoute('getAQuote')">{{ 'HOME.COVERDBANNER.FORM.BUTTON' | translate }}</button>
        </div>
      </div>
    </div>
  </div>

  <!-- footuper -->
  <app-foot-upper></app-foot-upper>

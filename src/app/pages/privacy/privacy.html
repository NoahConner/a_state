<div class="privacyMain">
  <div class="topBanner">
    <div class="container">
      <div class="h1" [innerHTML]="'PRIVACY.HEADING' | translateHtml | async"></div>
    </div>
  </div>
</div>

<section class="privacy-section py-5">
  <div class="container">
    <h2 class="section-title" [innerHTML]="'PRIVACY.INTRODUCTION.TITLE' | translateHtml | async"></h2>
    <p [innerHTML]="'PRIVACY.INTRODUCTION.DESCRIPTION' | translateHtml | async"></p>
    <p class="effective-date" [innerHTML]="'PRIVACY.INTRODUCTION.EFFECTIVE_DATE' | translateHtml | async"></p>

    <h2 class="section-title mt-5" [innerHTML]="'PRIVACY.INFORMATION_COLLECT.TITLE' | translateHtml | async"></h2>

    <h5 class="sub-title" [innerHTML]="'PRIVACY.INFORMATION_COLLECT.PERSONAL_TITLE' | translateHtml | async"></h5>
    <p [innerHTML]="'PRIVACY.INFORMATION_COLLECT.PERSONAL_DESC' | translateHtml | async"></p>

    <ol>
      <li *ngFor="let item of personalList">
        {{ item | translate }}
      </li>
    </ol>

    <p [innerHTML]="'PRIVACY.INFORMATION_COLLECT.PERSONAL_NOTE' | translateHtml | async"></p>

    <h5 class="sub-title mt-4" [innerHTML]="'PRIVACY.INFORMATION_COLLECT.AUTO_TITLE' | translateHtml | async"></h5>
    <p [innerHTML]="'PRIVACY.INFORMATION_COLLECT.AUTO_DESC' | translateHtml | async"></p>

    <ol>
      <li *ngFor="let item of AUTO_LIST">{{ item | translate }}</li>
    </ol>
    <p [innerHTML]="'PRIVACY.INFORMATION_COLLECT.AUTO_NOTE' | translateHtml | async"></p>

    <h2 class="section-title mt-5" [innerHTML]="'PRIVACY.HOW_COLLECT.TITLE' | translateHtml | async"></h2>
    <p [innerHTML]="'PRIVACY.HOW_COLLECT.DESCRIPTION' | translateHtml | async"></p>

    <h2 class="section-title mt-5" [innerHTML]="'PRIVACY.HOW_USE.TITLE' | translateHtml | async"></h2>
    <p [innerHTML]="'PRIVACY.HOW_USE.DESCRIPTION' | translateHtml | async"></p>

    <h2 class="section-title mt-5" [innerHTML]="'PRIVACY.COOKIES.TITLE' | translateHtml | async"></h2>
    <p [innerHTML]="'PRIVACY.COOKIES.DESCRIPTION' | translateHtml | async"></p>

    <h2 class="section-title mt-5" [innerHTML]="'PRIVACY.SHARING.TITLE' | translateHtml | async"></h2>
    <p [innerHTML]="'PRIVACY.SHARING.DESCRIPTION' | translateHtml | async"></p>

    <h2 class="section-title mt-5" [innerHTML]="'PRIVACY.SECURITY.TITLE' | translateHtml | async"></h2>
    <p [innerHTML]="'PRIVACY.SECURITY.DESCRIPTION' | translateHtml | async"></p>

    <h2 class="section-title mt-5" [innerHTML]="'PRIVACY.RIGHTS.TITLE' | translateHtml | async"></h2>
    <p [innerHTML]="'PRIVACY.RIGHTS.DESCRIPTION' | translateHtml | async"></p>

    <h2 class="section-title mt-5" [innerHTML]="'PRIVACY.THIRD_PARTY.TITLE' | translateHtml | async"></h2>
    <p [innerHTML]="'PRIVACY.THIRD_PARTY.DESCRIPTION' | translateHtml | async"></p>

    <h2 class="section-title mt-5" [innerHTML]="'PRIVACY.CHILDREN.TITLE' | translateHtml | async"></h2>
    <p [innerHTML]="'PRIVACY.CHILDREN.DESCRIPTION' | translateHtml | async"></p>

    <h2 class="section-title mt-5" [innerHTML]="'PRIVACY.UPDATES.TITLE' | translateHtml | async"></h2>
    <p [innerHTML]="'PRIVACY.UPDATES.DESCRIPTION' | translateHtml | async"></p>

    <h2 class="section-title mt-5" [innerHTML]="'PRIVACY.CONTACT.TITLE' | translateHtml | async"></h2>
    <p [innerHTML]="'PRIVACY.CONTACT.DESCRIPTION' | translateHtml | async"></p>

    <div class="contact-info">
      <p>
        <strong [innerHTML]="'PRIVACY.CONTACT.PHONE' | translateHtml | async"></strong>
        <a href="tel:7133577771">(713) 357-7771</a>
      </p>
      <p>
        <strong [innerHTML]="'PRIVACY.CONTACT.EMAIL' | translateHtml | async"></strong>
        <a href="mailto:save@astateinsurance.com">
          save@astateinsurance.com
        </a>
      </p>
      <p>
        <strong [innerHTML]="'PRIVACY.CONTACT.ADDRESS' | translateHtml | async"></strong>
        707 Shotwell St, Houston, TX 77020, United States
      </p>
      <p class="highlight" [innerHTML]="'PRIVACY.CONTACT.FOOTER' | translateHtml | async"></p>
    </div>
  </div>
</section>

<div class="footUpper">
  <div class="left"></div>
  <div class="right"></div>
  <div class="clipp"></div>
  <div class="contain">
    <div class="container">
      <div class="row">
        <div class="col-lg-6 col-sm-6 col-xs-12">
          <div class="icon">
            <img src="/assets/images/logo.png" alt="User menu" />
          </div>
        </div>
        <div class="col-lg-6 col-sm-6 col-xs-12">
          <div class="h4" [innerHTML]="'FOOTER.SLOGAN' | translateHtml | async"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="termsMain">
  <div class="topBanner">
    <div class="container">
      <div class="h1" [innerHTML]="'TERMS_PAGE.HEADING' | translateHtml | async"></div>
    </div>
  </div>
</div>

<section class="terms-section">
  <div class="container">
    <div class="terms-block" *ngFor="let section of termsSections">
      <h2 class="terms-heading">
        {{ section.title | translate }}
      </h2>

      <p *ngFor="let paragraph of section.paragraphs">
        {{ paragraph | translate }}
      </p>

      <!-- Bullet Points Support -->
      <ul *ngIf="section.points">
        <li *ngFor="let point of section.points">
          {{ point | translate }}
        </li>
      </ul>
    </div>

    <div class="terms-block">
      <h2 class="contact-title" [innerHTML]="'TERMS_PAGE.CONTACT_INFO.TITLE' | translateHtml | async"></h2>
      <div class="contact-content">
        <h3 [innerHTML]="'TERMS_PAGE.CONTACT_INFO.COMPANY' | translateHtml | async"></h3>

        <p [innerHTML]="'TERMS_PAGE.CONTACT_INFO.ADDRESS' | translateHtml | async"></p>

        <p>
          <strong [innerHTML]="'TERMS_PAGE.CONTACT_INFO.PHONE_LABEL' | translateHtml | async"></strong>
          <a href="tel:7133577771" [innerHTML]="'TERMS_PAGE.CONTACT_INFO.PHONE' | translateHtml | async"></a>
        </p>

        <p>
          <strong [innerHTML]="'TERMS_PAGE.CONTACT_INFO.EMAIL_LABEL' | translateHtml | async"></strong>
          <a href="mailto:save@astateinsurance.com" [innerHTML]="'TERMS_PAGE.CONTACT_INFO.EMAIL' | translateHtml | async"></a>
        </p>

        <p [innerHTML]="'TERMS_PAGE.CONTACT_INFO.HOURS' | translateHtml | async"></p>
      </div>
    </div>
  </div>
</section>

<div class="footUpper">
  <div class="left"></div>
  <div class="right"></div>
  <div class="clipp"></div>
  <div class="contain">
    <div class="container">
      <div class="row">
        <div class="col-lg-6 col-sm-6 col-xs-12">
          <div class="icon">
            <img src="/assets/images/logo.png" alt="User menu" />
          </div>
        </div>
        <div class="col-lg-6 col-sm-6 col-xs-12">
          <div class="h4" [innerHTML]="'FOOTER.SLOGAN' | translateHtml | async"></div>
        </div>
      </div>
    </div>
  </div>
</div>
